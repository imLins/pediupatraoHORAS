<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Auditoria - PediuPatrão</title>
    <!-- Injeção direta do Bootstrap para garantir o visual -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<!-- Se estiver a usar fragmentos, ele pega esta div. Se não, renderiza a página inteira com o CSS acima -->
<div th:fragment="content" class="container py-5">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-shield-lock me-2 text-primary"></i>Registro de Auditoria
        </h2>
        <a th:href="@{/}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Voltar para Home
        </a>
    </div>

    <!-- Tabela de Registros -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data/Hora</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Valores Anteriores</th>
                        <th>Novos Valores</th>
                        <th class="pe-4">Justificativa</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(auditorias)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum registro de auditoria encontrado.
                        </td>
                    </tr>
                    <tr th:each="log : ${auditorias}">
                        <td class="ps-4 text-muted small" th:text="${#temporals.format(log.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="fw-bold text-primary" th:text="${log.usuario}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${#strings.replace(log.perfilUsuario, 'ROLE_', '')}"></span>
                        </td>
                        <td>
                            <span class="badge bg-info text-dark" th:if="${log.operacao.contains('INCLUSÃO')}" th:text="${log.operacao}"></span>
                            <span class="badge bg-warning text-dark" th:if="${log.operacao.contains('ALTERAÇÃO')}" th:text="${log.operacao}"></span>
                            <span class="badge bg-danger" th:if="${log.operacao.contains('CANCELAMENTO')}" th:text="${log.operacao}"></span>
                            <span class="badge bg-success" th:if="${log.operacao.contains('DESCONTO')}" th:text="${log.operacao}"></span>
                            <span class="badge bg-secondary" th:if="${!log.operacao.contains('INCLUSÃO') and !log.operacao.contains('ALTERAÇÃO') and !log.operacao.contains('CANCELAMENTO') and !log.operacao.contains('DESCONTO')}" th:text="${log.operacao}"></span>
                        </td>
                        <td><span class="badge bg-light text-dark border" th:text="${log.entidadeAfetada}"></span></td>
                        <td class="small text-muted" th:text="${log.valoresAnteriores}"></td>
                        <td class="small text-dark fw-semibold" th:text="${log.valoresNovos}"></td>
                        <td class="pe-4 fst-italic text-muted small" th:text="${log.justificativa}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white text-muted small py-3" th:if="${!#lists.isEmpty(auditorias)}">
            Total: <strong th:text="${#lists.size(auditorias)}"></strong> registro(s) auditado(s) com segurança.
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

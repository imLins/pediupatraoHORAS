<!DOCTYPE html>
<!-- Adicionada a tag sec do Spring Security -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <!-- Cabeçalho com o Título e o Botão de Novo Pedido -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <!-- Botão visível para Atendente, Gerente e Admin -->
        <a th:href="@{/pedidos/novo}" class="btn btn-primary" sec:authorize="hasAnyAuthority('ROLE_ATENDENTE', 'ROLE_GERENTE', 'ROLE_ADMIN')">
            <i class="bi bi-plus-circle me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Cliente ID</th>
                    <th>Tipo de Pizza</th>
                    <th>Sabor</th>
                    <th>Quantidade</th>
                    <th>Status</th>
                    <!-- Nova coluna de ações -->
                    <th class="text-end pe-4">Ações</th>
                </tr>
                </thead>
                <tbody>
                <!-- Lista vazia -->
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="7" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        Nenhum pedido encontrado.
                    </td>
                </tr>
                <!-- Linhas -->
                <tr th:each="pedido : ${pedidos}">
                    <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                    <td th:text="${pedido.clienteId}"></td>
                    <td th:text="${pedido.tipoPizza}"></td>
                    <td th:text="${pedido.sabor}"></td>
                    <td th:text="${pedido.quantidade}"></td>
                    <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'ENTREGUE'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                    </td>

                    <!-- Coluna com os botões e Modais restritos -->
                    <td class="text-end pe-4">
                        <!-- RF04: Apenas GERENTE visualiza este bloco -->
                        <div sec:authorize="hasAnyAuthority('ROLE_GERENTE')" class="d-flex gap-2 justify-content-end">

                            <!-- Botão que abre o Modal de Desconto -->
                            <button type="button" class="btn btn-sm btn-success" data-bs-toggle="modal" th:data-bs-target="'#modalDesconto' + ${pedido.id}" title="Aplicar Desconto">
                                <i class="bi bi-percent"></i>
                            </button>

                            <!-- Botão que abre o Modal de Cancelamento -->
                            <button type="button" class="btn btn-sm btn-danger" data-bs-toggle="modal" th:data-bs-target="'#modalCancelar' + ${pedido.id}" title="Cancelar Pedido">
                                <i class="bi bi-x-circle"></i>
                            </button>

                            <!-- ============================================== -->
                            <!-- MODAL DE DESCONTO -->
                            <!-- ============================================== -->
                            <div class="modal fade" th:id="'modalDesconto' + ${pedido.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <!-- Envia para a rota de desconto com o ID dinâmico -->
                                        <form th:action="@{/api/pedidos/{id}/desconto(id=${pedido.id})}" method="post">
                                            <div class="modal-header bg-success text-white">
                                                <h5 class="modal-title">Aplicar Desconto</h5>
                                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body text-start">
                                                <label class="form-label fw-bold">Percentual de Desconto (%)</label>
                                                <input type="number" name="percentualDesconto" class="form-control" min="1" max="20" placeholder="Máx 20%" required>
                                                <small class="text-muted">O valor será recalculado automaticamente no servidor.</small>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                                                <button type="submit" class="btn btn-success">Aplicar Desconto</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <!-- ============================================== -->
                            <!-- MODAL DE CANCELAMENTO -->
                            <!-- ============================================== -->
                            <div class="modal fade" th:id="'modalCancelar' + ${pedido.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <!-- Envia para a rota de cancelamento com o ID dinâmico -->
                                        <form th:action="@{/api/pedidos/{id}/cancelar(id=${pedido.id})}" method="post">
                                            <div class="modal-header bg-danger text-white">
                                                <h5 class="modal-title">Cancelar Pedido</h5>
                                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body text-start">
                                                <label class="form-label fw-bold">Justificativa do Cancelamento</label>
                                                <textarea name="justificativa" class="form-control" rows="3" placeholder="Por que este pedido está sendo cancelado?" required></textarea>
                                                <small class="text-danger">Atenção: Esta ação é irreversível e será auditada.</small>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                                                <button type="submit" class="btn btn-danger">Confirmar Cancelamento</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<!-- Adicionada a tag sec do Spring Security -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Cliente ID</th>
                    <th>Tipo de Pizza</th>
                    <th>Sabor</th>
                    <th>Quantidade</th>
                    <th>Status</th>
                    <!-- Nova coluna de ações -->
                    <th class="text-end pe-4">Ações</th>
                </tr>
                </thead>
                <tbody>
                <!-- Lista vazia -->
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="7" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        Nenhum pedido encontrado.
                    </td>
                </tr>
                <!-- Linhas -->
                <tr th:each="pedido : ${pedidos}">
                    <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                    <td th:text="${pedido.clienteId}"></td>
                    <td th:text="${pedido.tipoPizza}"></td>
                    <td th:text="${pedido.sabor}"></td>
                    <td th:text="${pedido.quantidade}"></td>
                    <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'ENTREGUE'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                    </td>

                    <!-- Nova célula com os botões restritos -->
                    <td class="text-end pe-4">
                        <!-- RF04: Apenas GERENTE visualiza este bloco -->
                        <div sec:authorize="hasRole('GERENTE')" class="d-flex gap-2 justify-content-end">

                            <!-- Botão de Desconto (th:action garante proteção CSRF) -->
                            <form th:action="@{/api/pedidos/desconto}" method="post">
                                <input type="hidden" name="id" th:value="${pedido.id}" />
                                <!-- Exemplo enviando 10% de desconto -->
                                <input type="hidden" name="percentualDesconto" value="10.0" />
                                <button type="submit" class="btn btn-sm btn-success" title="Aplicar Desconto">
                                    <i class="bi bi-percent"></i>
                                </button>
                            </form>

                            <!-- Botão de Cancelar (th:action garante proteção CSRF) -->
                            <form th:action="@{/api/pedidos/cancelar}" method="post">
                                <input type="hidden" name="id" th:value="${pedido.id}" />
                                <!-- Exemplo de justificativa padrão (idealmente viria de um modal) -->
                                <input type="hidden" name="justificativa" value="Cancelado pelo Gerente via painel." />
                                <button type="submit" class="btn btn-sm btn-danger" title="Cancelar Pedido">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>

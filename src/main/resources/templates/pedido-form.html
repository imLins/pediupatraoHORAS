<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>
<div th:fragment="content">
    <div class="card shadow-sm max-w-md mx-auto">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="bi bi-cart-plus me-2"></i>Registrar Novo Pedido</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/api/pedidos/salvar}" method="post">

                <!-- Seleção do Cliente -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Cliente</label>
                    <select class="form-select" name="clienteId" required>
                        <option value="" disabled selected>Selecione um cliente...</option>
                        <!-- O Spring vai preencher essa lista -->
                        <option th:each="cliente : ${clientes}"
                                th:value="${cliente.id}"
                                th:text="${cliente.nome + ' (' + cliente.telefone + ')'}">
                        </option>
                    </select>
                </div>

                <!-- Tipo de Pizza -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Pizza</label>
                    <select class="form-select" name="tipoPizza" required>
                        <option value="Tradicional">Tradicional (R$ 50,00)</option>
                        <option value="Especial">Especial (R$ 70,00)</option>
                        <option value="Doce">Doce (R$ 60,00)</option>
                    </select>
                </div>

                <!-- Sabor -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Sabor</label>
                    <input type="text" class="form-control" name="sabor" placeholder="Ex: Calabresa, Marguerita..." required>
                </div>

                <!-- Quantidade -->
                <div class="mb-4">
                    <label class="form-label fw-bold">Quantidade</label>
                    <input type="number" class="form-control" name="quantidade" min="1" value="1" required>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle me-1"></i> Confirmar Pedido
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Pedido - PediuPatrão</title>
    <!-- Injeção direta do Bootstrap para garantir o visual -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:fragment="content" class="container py-5">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-cart-plus me-2 text-primary"></i>Novo Pedido
        </h2>
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Voltar para Lista
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h5 class="text-muted"><i class="bi bi-ui-checks-grid me-2"></i>Detalhes do Pedido</h5>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/api/pedidos/salvar}" method="post">

                        <div class="alert alert-info border-0 bg-info bg-opacity-10 text-info-emphasis mb-4 d-flex align-items-center" role="alert">
                            <i class="bi bi-shield-check me-3 fs-3"></i>
                            <div>
                                <strong>Cálculo Automático Seguro:</strong> O valor final a pagar será calculado e registrado pelo servidor.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-secondary">1. Selecione o Cliente</label>
                            <select class="form-select form-select-lg" name="clienteId" required>
                                <option value="" disabled selected>Clique para escolher o cliente...</option>
                                <option th:each="cliente : ${clientes}"
                                        th:value="${cliente.id}"
                                        th:text="${cliente.nome + ' (' + cliente.telefone + ')'}">
                                </option>
                            </select>
                        </div>

                        <hr class="my-4 text-muted opacity-25">

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-secondary">2. Tamanho / Categoria</label>
                                <select class="form-select form-select-lg" name="tipoPizza" required>
                                    <option value="" disabled selected>Escolha o tipo...</option>
                                    <option value="Tradicional">Tradicional (R$ 50,00)</option>
                                    <option value="Especial">Especial (R$ 70,00)</option>
                                    <option value="Doce">Doce (R$ 60,00)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold text-secondary">3. Sabor Principal</label>
                                <input type="text" class="form-control form-control-lg" name="sabor" placeholder="Ex: Calabresa..." required>
                            </div>
                        </div>

                        <div class="mb-5 w-50">
                            <label class="form-label fw-bold text-secondary">4. Quantidade</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-hash"></i></span>
                                <input type="number" class="form-control" name="quantidade" min="1" value="1" required>
                            </div>
                        </div>

                        <div class="d-flex gap-3 justify-content-end border-top pt-4">
                            <a th:href="@{/pedidos}" class="btn btn-lg btn-light text-secondary border">Cancelar</a>
                            <button type="submit" class="btn btn-lg btn-primary px-4 shadow-sm">
                                <i class="bi bi-check2-circle me-2"></i> Confirmar Pedido
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

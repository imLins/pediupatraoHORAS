<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div th:fragment="sidebar">
    <div id="sidebar" class="d-flex flex-column" style="min-height: 100vh;">
        <h4 class="text-center py-3">Pediu Patrão</h4>
        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/}" aria-current="page">
                    <i class="bi bi-house"></i><span class="d-none d-md-inline">&nbsp;Home</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/clientes}">
                    <i class="bi bi-person-raised-hand"></i><span class="d-none d-md-inline">&nbsp;Clientes</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/pedidos}">
                    <i class="bi bi-bag"></i><span class="d-none d-md-inline">&nbsp;Pedidos</span>
                </a>
            </li>

            <!-- RF05: Link de Auditoria (Apenas ADMIN e GERENTE) -->
            <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_GERENTE')">
                <a class="nav-link" th:href="@{/auditoria}">
                    <i class="bi bi-shield-lock"></i><span class="d-none d-md-inline">&nbsp;Auditoria</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
                    <i class="bi bi-gear"></i><span class="d-none d-md-inline">&nbsp;Configurações</span>
                    <span class="float-end">&#9662;</span>
                </a>
                <ul class="nav flex-column submenu">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/funcionarios}">
                            <i class="bi bi-person-walking"></i><span class="d-none d-md-inline">&nbsp;Funcionários</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/entregadores}">
                            <i class="bi bi-bicycle"></i><span class="d-none d-md-inline">&nbsp;Entregadores</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/horarios}">
                            <i class="bi bi-clock"></i><span class="d-none d-md-inline">&nbsp;Horário de Funcionamento</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/produtos}">
                            <i class="bi bi-boxes"></i><span class="d-none d-md-inline">&nbsp;Produtos</span>
                        </a>
                    </li>

                    <!-- RF01: Link de Usuários (Apenas ADMIN) -->
                    <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                        <a class="nav-link" th:href="@{/usuarios}">
                            <i class="bi bi-people-fill"></i><span class="d-none d-md-inline">&nbsp;Usuários</span>
                        </a>
                    </li>
                </ul>
            </li>
        </ul>

        <!-- Botão de Sair Fixo no Rodapé do Menu -->
        <hr class="text-white-50 my-2">
        <div class="px-3 pb-4">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-danger w-100 d-flex align-items-center justify-content-center gap-2 shadow-sm">
                    <i class="bi bi-box-arrow-left"></i>
                    <span class="d-none d-md-inline fw-bold">Sair</span>
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
